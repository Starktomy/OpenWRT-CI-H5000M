# 定时自动编译：Auto-Clean 定时清理成功后自动构建设备固件
name: MTK-AUTO

on:
  # 仅定时清理成功后自动触发；手动清理/预览不会重复编译。
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 也可手动触发
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string

permissions: write-all

jobs:
  config:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success')
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # H5000M：Next / 传统版 / Modem Pro / MT5700 / MT5700M
          # QModem 使用官方 master，其余方案使用 VIKINGYFY/owrt
          - CONFIG: H5000M-qmodem-next
            SOURCE: immortalwrt/immortalwrt
            BRANCH: master
          - CONFIG: H5000M-qmodem
            SOURCE: immortalwrt/immortalwrt
            BRANCH: master
          - CONFIG: H5000M-modem-pro
            SOURCE: VIKINGYFY/immortalwrt
            BRANCH: owrt
          - CONFIG: H5000M-mt5700
            SOURCE: VIKINGYFY/immortalwrt
            BRANCH: owrt
          - CONFIG: H5000M-mt5700m
            SOURCE: VIKINGYFY/immortalwrt
            BRANCH: owrt

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}

      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}

      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ toJSON(false) }}
