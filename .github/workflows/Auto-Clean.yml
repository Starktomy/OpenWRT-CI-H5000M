name: Auto-Clean

on:
  # 每天 UTC 21:00（北京时间次日 05:00）清理，成功后联动 MTK-AUTO。
  schedule:
    - cron: 0 21 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览固件保留计划，不删除 Release、Tag 或旧运行记录'
        type: boolean
        default: false

permissions: write-all

concurrency:
  group: release-retention-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto_clean:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Release Retention
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Config
            .github/scripts
            tests

      - name: Test Release Retention
        run: python3 -m unittest discover -s tests -p test_release_retention.py -v

      - name: Retain Latest 3 Releases per Driver and Profile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          ARGS=(--repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" != true ]; then
            ARGS+=(--apply)
          fi
          python3 .github/scripts/release-retention.py "${ARGS[@]}"

      - name: Clean old workflow runs (keep 30 days)
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CUTOFF_DATE=$(date -d '30 days ago' +%Y-%m-%d)
          echo "Deleting workflow runs older than ${CUTOFF_DATE}..."

          WORKFLOWS=$(gh api "repos/${{ github.repository }}/actions/workflows" --jq '.workflows[].id')

          for WF_ID in ${WORKFLOWS}; do
            OLD_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/${WF_ID}/runs?per_page=100&status=completed" \
              --jq ".workflow_runs | map(select(.created_at < \"${CUTOFF_DATE}\")) | .[].id")

            for RUN_ID in ${OLD_RUNS}; do
              echo "  Deleting run ${RUN_ID}..."
              gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" -X DELETE --silent || true
            done
          done

          echo "=== Workflow cleanup done ==="
